# Geplande sync van kavvv-vb-ov.be naar Supabase.
# GitHub cron loopt in UTC; de tijden hieronder zijn gekozen voor wintertijd (CET, Brussel).
# In zomertijd (tot eind oktober en vanaf eind maart) loopt de job één uur later, wat voor uitslagen geen kwaad kan.
#
# De job draait elke week, ook zonder matchen. Daardoor blijft het Supabase-project actief (gratis projecten
# worden na 7 dagen zonder gebruik gepauzeerd) en committeert de job maandelijks docs/LAATSTE_SYNC.md,
# want GitHub schakelt geplande workflows uit na 60 dagen zonder commits in de repository.
name: sync-competition

on:
  schedule:
    - cron: "0 19 * * 6"   # zaterdag 20:00 Brussel (zomertijd 21:00)
    - cron: "0 17 * * 0"   # zondag 18:00 Brussel (zomertijd 19:00)
    - cron: "0 8 * * 1"    # maandag 09:00 Brussel (zomertijd 10:00)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Alleen tonen wat zou wijzigen (niets schrijven)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-competition
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache van opgehaalde pagina's herstellen (ploegpagina's worden zo maar wekelijks opgehaald)
        uses: actions/cache@v4
        with:
          path: .cache
          key: kavvv-pagina-cache-${{ github.run_id }}
          restore-keys: kavvv-pagina-cache-

      - name: Installeren
        run: pip install -e .

      - name: Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SYNC_CONTACT: ${{ secrets.SYNC_CONTACT }}
        run: sync-competition ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: HTML bewaren als de parser faalde (site gewijzigd)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incoming-html-${{ github.run_id }}
          path: tests/fixtures/incoming/
          if-no-files-found: ignore
          retention-days: 30

      - name: Rooster actief houden (één commit per maand, raakt de app niet)
        if: ${{ !inputs.dry_run }}
        run: |
          printf 'Laatste automatische synchronisatie: %s\n\nDit bestand wordt maandelijks bijgewerkt door de sync-job, zodat GitHub het rooster niet uitschakelt na 60 dagen zonder commits.\n' "$(date -u +%Y-%m)" > docs/LAATSTE_SYNC.md
          if ! git diff --quiet -- docs/LAATSTE_SYNC.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/LAATSTE_SYNC.md
            git commit -m "Sync-job actief: $(date -u +%Y-%m)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
